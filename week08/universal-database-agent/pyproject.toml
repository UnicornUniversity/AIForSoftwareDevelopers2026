[project]
name = "uda"
version = "0.1.0"
description = "Universal Database Agent — read-only SQL Server knowledge discovery"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langchain>=0.3,<2",
    "langgraph>=0.2,<2",
    "langfuse>=3,<4",
    "pydantic>=2.9,<3",
    "pyyaml>=6,<7",
    "python-dotenv>=1,<2",
    "sqlalchemy>=2.0,<3",
    "pyodbc>=5.1,<6",
    "openai>=3.52,<4",
    "jsonschema>=4.26,<5",
    "sqlglot>=30.33.0",
]

[dependency-groups]
dev = [
    "mypy>=1.13,<2",
    "pytest>=8,<9",
    "ruff>=0.9,<1",
    "types-pyyaml>=6.0,<7",
]

[project.scripts]
uda = "uda.cli:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"

[tool.pytest.ini_options]
addopts = "-m 'not db and not llm and not langfuse'"
markers = [
    "db: requires a live database",
    "llm: requires a live LLM provider",
    "langfuse: requires a running Langfuse instance",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "pyodbc"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "jsonschema"
ignore_missing_imports = true
