# Optional local Ollama profile. Non-secret values only.
# The model below is a candidate; replace it with an installed model and verify tool calling
# before relying on this profile (R-14).
profile: ollama

database:
  host: localhost
  port: 1433
  name: Northwind
  user: uda_readonly
  driver: "ODBC Driver 18 for SQL Server"
  schema: dbo
  timeout_seconds: 30
  row_limit: 1000

llm:
  provider: ollama
  base_url: http://localhost:11434/v1
  model: qwen3.5:9b
  temperature: 0.0
  max_tokens: 1024

observability:
  tracer: noop
