[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "drone-vision-lab"
version = "0.1.0"
description = "Classroom desktop lab for DJI Tello control and computer-vision comparison"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "PySide6>=6.8,<7",
    "numpy>=1.26,<3",
]

[project.optional-dependencies]
# Vision lab core: OpenCV is required by the Computer Vision Lab tab. The
# application must still start without it and say what is missing.
vision = [
    "opencv-python>=4.10,<5",
]
# Optional heavy stack; only needed for the YOLO detector.
yolo = [
    "ultralytics>=8.3,<9",
]
# Real-hardware stack: Tello H.264 video decoding.
hardware = [
    "av>=13,<16",
]
# Retained for a future gamepad lesson. The application does not import pygame;
# the current UI reads no controller input.
gamepad = [
    "pygame>=2.5,<3",
]
all = [
    "drone-vision-lab[vision,yolo,hardware]",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
drone-vision-lab = "drone_vision_lab.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "hardware: requires a physical DJI Tello (opt-in, never run by default)",
    "ollama: requires a local Ollama service (opt-in, never run by default)",
    "model: requires locally downloaded YOLO weights (opt-in, never run by default)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
warn_unused_ignores = true
