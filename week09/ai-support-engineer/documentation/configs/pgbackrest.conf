# /etc/pgbackrest/pgbackrest.conf
# Per-DB-host configuration for pgBackRest.
# See runbooks/backup-procedures.md.

[global]
repo1-type=s3
repo1-s3-endpoint=s3.brn1.pchosting.internal
repo1-s3-bucket=pch-backups
repo1-s3-region=brn1
repo1-s3-key=REDACTED
repo1-s3-key-secret=REDACTED
repo1-s3-uri-style=path
repo1-path=/pgbackrest
repo1-retention-full=8
repo1-retention-diff=4
repo1-cipher-type=aes-256-cbc
repo1-cipher-pass=REDACTED

process-max=4
log-level-console=info
log-level-file=detail

# Compression for cold storage
compress-type=zstd
compress-level=3

# WAL archiving
archive-async=y
archive-push-queue-max=1GiB
archive-timeout=60

# --- Stanzas: one per DB host ---

[pg-acme]
pg1-path=/var/lib/postgresql/15/main
pg1-port=5432
pg1-user=postgres

[pg-mediastar-02]
pg1-path=/var/lib/postgresql/15/main
pg1-port=5432
pg1-user=postgres

[pg-legacy-a]
pg1-path=/var/lib/postgresql/12/main
pg1-port=5432
pg1-user=postgres
# NOTE: PG 12 is EOL — see known_issues/postgres-issues.md KI-PG-005

[pg-legacy-b]
pg1-path=/var/lib/postgresql/12/main
pg1-port=5432
pg1-user=postgres
