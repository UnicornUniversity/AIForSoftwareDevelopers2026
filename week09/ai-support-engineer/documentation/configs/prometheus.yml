# /etc/prometheus/prometheus.yml
# Reference config for the PRG1 monitoring stack.
# See docs/10-monitoring-stack.md for context.

global:
  scrape_interval:     15s
  evaluation_interval: 30s
  external_labels:
    region: prg1
    cluster: pch-prod

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager-0.alertmanager.monitoring.svc:9093
          - alertmanager-1.alertmanager.monitoring.svc:9093

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'kubelet'
    kubernetes_sd_configs:
      - role: node
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      insecure_skip_verify: false
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)

  - job_name: 'node-exporter'
    kubernetes_sd_configs:
      - role: endpoints
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_label_app]
        action: keep
        regex: node-exporter

  - job_name: 'cadvisor'
    kubernetes_sd_configs:
      - role: node
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    metrics_path: /metrics/cadvisor

  - job_name: 'nginx-edge'
    static_configs:
      - targets:
        - edge-01.prg1.pchosting.internal:9113
        - edge-02.prg1.pchosting.internal:9113
    metrics_path: /metrics

  - job_name: 'postgres'
    static_configs:
      - targets:
        - pg-acme-01.prg1:9187
        - pg-mediastar-02.prg1:9187
        - pg-legacy-a.prg1:9187
        - pg-legacy-b.prg1:9187
    metrics_path: /metrics
    relabel_configs:
      - source_labels: [__address__]
        regex: 'pg-([^.]+)\..*'
        target_label: tenant
        replacement: '${1}'

  - job_name: 'blackbox-https'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
        - https://portal.pchosting.cz
        - https://status.pchosting.cz
        - https://s3.prg1.pchosting.cz/probe-canary
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: 'docker-daemon'
    static_configs:
      - targets:
        - legacy-app-01.prg1.pchosting.internal:9323
        - legacy-app-02.prg1.pchosting.internal:9323

# Long-term storage via Thanos sidecar in a separate deployment.
# See docs/10-monitoring-stack.md.
