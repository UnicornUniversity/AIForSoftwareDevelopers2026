# /etc/postgresql/15/main/pg_hba.conf
# Auth for PCH managed Postgres instances.
# See docs/06-postgres-administration.md.

# TYPE  DATABASE        USER            ADDRESS                 METHOD

# --- Local system access ---
local   all             postgres                                peer
local   all             all                                     scram-sha-256

# --- Loopback ---
host    all             all             127.0.0.1/32            scram-sha-256
host    all             all             ::1/128                 scram-sha-256

# --- Replication (streaming + pgbackrest) ---
host    replication     replica_user    10.20.0.0/16            scram-sha-256

# --- Customer VLAN (internal only, never public) ---
host    all             +tenant_admin   10.100.0.0/14           scram-sha-256
host    all             +app_role       10.100.0.0/14           scram-sha-256

# --- Managed connection pooler (PgBouncer on Business plans) ---
host    all             +app_role       10.20.50.0/24           scram-sha-256

# --- Monitoring (postgres_exporter) ---
host    postgres        monitor_user    10.20.30.0/24           scram-sha-256

# --- Ops break-glass, keys distributed by Vault ---
hostssl all             +db_admin       10.20.100.0/24          cert    clientcert=verify-full

# Deny all else.
host    all             all             0.0.0.0/0               reject
host    all             all             ::/0                    reject
