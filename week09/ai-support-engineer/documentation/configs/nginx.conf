# /etc/nginx/nginx.conf
# Reference nginx.conf used on edge-01, edge-02 (PRG1)
# Maintainer: Anežka K.
# Last touched: 2024-11-22 (see docs/04-nginx-configuration.md)

user  www-data;
worker_processes  auto;
worker_rlimit_nofile 65535;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  16384;
    multi_accept        on;
    use                 epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    '$request_time';

    access_log  /var/log/nginx/access.log  main buffer=64k flush=5s;

    sendfile         on;
    tcp_nopush       on;
    tcp_nodelay      on;

    keepalive_timeout   65;
    keepalive_requests  1000;
    types_hash_max_size 4096;

    server_tokens off;
    client_max_body_size 128M;
    client_body_buffer_size 128k;

    # Gzip
    gzip              on;
    gzip_vary         on;
    gzip_min_length   256;
    gzip_comp_level   5;
    gzip_types        text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=req_limit_per_ip:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login_limit_per_ip:10m rate=3r/s;

    # Real IP from Cloudflare — see snippets/cloudflare-realip.conf
    include /etc/nginx/snippets/cloudflare-realip.conf;

    # Common SSL settings (Mozilla intermediate)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # Security headers (applied via include in vhosts)
    map $sent_http_content_type $header_x_frame_options {
        default "SAMEORIGIN";
        "~image/" "";
    }

    # Per-vhost configs
    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;
}

# Stream block for TCP passthrough (Postgres direct-access for a couple
# of legacy customers — do NOT use for new customers, see
# known_issues/postgres-issues.md)
stream {
    upstream pg_legacy_a {
        server 10.100.7.11:5432;
    }
    server {
        listen 5432;
        proxy_pass pg_legacy_a;
    }
}
