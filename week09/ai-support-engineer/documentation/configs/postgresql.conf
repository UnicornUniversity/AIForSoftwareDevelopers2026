# /etc/postgresql/15/main/postgresql.conf
# Reference tuning for PG-Pro tier instances.
# See docs/06-postgres-administration.md for background.

# --- Connections ---
listen_addresses = '*'
port = 5432
max_connections = 200
superuser_reserved_connections = 5

# --- Auth / SSL ---
ssl = on
ssl_cert_file = '/etc/postgresql/15/main/server.crt'
ssl_key_file  = '/etc/postgresql/15/main/server.key'
password_encryption = scram-sha-256

# --- Memory ---
shared_buffers = 4GB              # 25% of 16GB RAM
work_mem = 32MB
maintenance_work_mem = 512MB
effective_cache_size = 12GB       # 75% of RAM

# --- WAL ---
wal_level = replica
wal_compression = on
max_wal_size = 4GB
min_wal_size = 1GB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
archive_mode = on
archive_command = 'pgbackrest --stanza=%%STANZA%% archive-push %p'
archive_timeout = 60

# --- Replication ---
max_wal_senders = 10
max_replication_slots = 10
hot_standby = on
hot_standby_feedback = on            # was off pre-2024-Q1, changed after KI-PG-004
wal_keep_size = 1024                 # MB

# --- Autovacuum overrides (PCH standard for Pro+ tier) ---
autovacuum = on
autovacuum_max_workers = 6
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
autovacuum_vacuum_cost_delay = 2ms

# --- Query planner ---
random_page_cost = 1.1              # SSD storage
effective_io_concurrency = 200
default_statistics_target = 200

# --- Logging ---
logging_collector = on
log_directory = '/var/log/postgresql'
log_filename = 'postgresql-%Y-%m-%d.log'
log_rotation_age = 1d
log_rotation_size = 512MB
log_min_duration_statement = 500ms
log_line_prefix = '%m [%p] %q%u@%d '
log_statement = 'ddl'
log_lock_waits = on
log_temp_files = 1MB
log_autovacuum_min_duration = 250ms

# --- Extensions ---
shared_preload_libraries = 'pg_stat_statements,pgaudit'
pg_stat_statements.track = all

# --- Misc ---
timezone = 'Europe/Prague'
lc_messages = 'en_US.UTF-8'
default_text_search_config = 'pg_catalog.english'
